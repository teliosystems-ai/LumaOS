name: Native platform boundaries

on:
  workflow_dispatch:
  push:
    paths:
      - 'rust/**'
      - 'native/**'
      - '.github/workflows/native-platform.yml'
  pull_request:
    paths:
      - 'rust/**'
      - 'native/**'
      - '.github/workflows/native-platform.yml'

permissions:
  contents: read

jobs:
  rust-boundaries:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned Ubuntu toolchain
        run: >-
          docker build
          --build-arg UBUNTU_BASE=ubuntu@sha256:008173c23f95b170204355c12626cb5a965d779a7e1283b09e9cffbb1bf33ca3
          -f native/image/Dockerfile.tools -t luma-native-tools:ci native/image
      - name: Rust tests and laboratory artifact CLI without network or host devices
        run: >-
          docker run --rm --network none
          --mount type=bind,src="$PWD",dst=/repo,readonly
          --env CARGO_TARGET_DIR=/tmp/luma-target
          --env RUSTFLAGS=-Dwarnings
          --workdir /repo/rust luma-native-tools:ci
          bash -euc 'cargo test --offline --locked;
          cargo build --offline --locked;
          bash /repo/native/image/test_artifact_cli.sh'
      - name: Builder and harness syntax
        run: |
          bash -n native/image/build.sh
          bash -n native/image/test_artifact_cli.sh
          sh -n native/image/overlay/usr/lib/systemd/system-generators/luma-boot-generator
          python3 -m py_compile native/image/*.py
          python3 -W error -m unittest discover -s native/tests -v
      - name: Rust formatting
        run: >-
          docker run --rm --network none
          --mount type=bind,src="$PWD",dst=/repo,readonly
          --workdir /repo/rust luma-native-tools:ci cargo fmt --check
      - name: Real Linux staging and storage boundaries
        run: |
          mkdir "$RUNNER_TEMP/luma-storage"
          docker run --rm --network none \
            --cap-add SYS_ADMIN --security-opt apparmor=unconfined \
            --security-opt no-new-privileges \
            --mount type=bind,src="$PWD",dst=/repo,readonly \
            --mount type=bind,src="$RUNNER_TEMP/luma-storage",dst=/out \
            luma-native-tools:ci bash /repo/native/tests/run_storage_boundaries.sh /out/results
      - name: Local TPM2 checkpoint boundaries on disposable software TPM
        run: |
          mkdir "$RUNNER_TEMP/luma-tpm"
          docker run --rm --network none --security-opt no-new-privileges \
            --mount type=bind,src="$PWD",dst=/repo,readonly \
            --mount type=bind,src="$RUNNER_TEMP/luma-tpm",dst=/out \
            luma-native-tools:ci bash /repo/native/tests/run_tpm_boundaries.sh /out/results
      - name: Retain TPM checkpoint diagnostics (no TPM state or secrets)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-tpm-boundaries
          path: ${{ runner.temp }}/luma-tpm
          if-no-files-found: ignore
      - name: Retain storage boundary diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-storage-boundaries
          path: ${{ runner.temp }}/luma-storage
          if-no-files-found: ignore

# Deliberately no disk installation, host firmware enrollment or gate promotion.
# Full image/VM runs are separately retained image-specific evidence.
# SYS_ADMIN above is confined to a disposable container's own mount namespace;
# no host devices, network or Docker socket are supplied to the test container.
