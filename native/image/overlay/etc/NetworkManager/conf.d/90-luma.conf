[main]
plugins=keyfile

[keyfile]
# Ubuntu's server default excludes Ethernet. Luma manages the selected native
# network devices and stores connection secrets only in encrypted/volatile var.
unmanaged-devices=
path=/var/lib/NetworkManager/system-connections

[device-luma-ethernet]
match-device=type:ethernet
managed=1

[connectivity]
# Do not send unsolicited connectivity-probe traffic to an external endpoint.
enabled=false
