[workspace]
members = ["luma-platform", "luma-content", "luma-content-store"]
resolver = "2"

[profile.release]
overflow-checks = true
panic = "abort"
strip = true
lto = true

# Development and test builds are lightly optimized because the serial
# luma-platform suite runs real bounded owner migrations, including under the
# index Start tests. Debug assertions and overflow checks stay on explicitly;
# this changes only speed, not what any test checks. The release profile is
# unchanged.
#
# Debug info is line tables only (file:line backtraces stay). Optimized code
# with full debug info made the luma-platform test executable 599,169,880
# bytes, over the unchanged 512 MiB cap that the TPM suite's disposable public
# test executable staging enforces; line tables bring it to 222,472,792 bytes.
[profile.dev]
opt-level = 1
debug = "line-tables-only"
debug-assertions = true
overflow-checks = true

# Test builds still rehash every large boundary input on every check: the
# staged public test executable before each PAM catalog case and the 512 MiB
# staging payload twice per verify. Optimizing the digest dependency further
# keeps each rehash.
[profile.dev.package.sha2]
opt-level = 3
